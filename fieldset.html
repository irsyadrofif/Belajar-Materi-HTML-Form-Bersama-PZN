<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Identitas</legend>
            <label for="nama">nama</label> <input type="text" name="nama" id="nama" ><br>
            <label for="Telephone">Telephone</label> <input type="tel" name="Telephone" id="Telephone" ><br>
            <label for="email">email</label> <input type="email" name="email" id="email" ><br>
        </fieldset>
        <fieldset>
            <legend>Alamat</legend>
            <input type="checkbox" name="Alamat" id="Alamat"> <label for="Alamat">Nganjuk</label><br>
            <input type="checkbox" name="Alamat" id="Alamat"> <label for="Alamat">Jombang</label><br>
            <input type="checkbox" name="Alamat" id="Alamat"> <label for="Alamat">Kediri</label><br>
        </fieldset>
         <fieldset><legend>soal, y<sup>3</sup>hasil turunan berapa</legend>
            <input type="radio" name="jawaban" id="jawaban1" value="A"><label for="jawaban1">3Y<sup>2</sup></label><br>
            <input type="radio" name="jawaban" id="jawaban2" value="B"><label for="jawaban2">4y<sup>2</sup></label><br>
            <input type="radio" name="jawaban" id="jawaban3" value="C"><label for="jawaban3">6y<sup>4</sup></label><br>
            <input type="radio" name="jawaban" id="jawaban4" value="D"><label for="jawaban4">7y<sup>2</sup></label><br>
         </fieldset>

        <input type="reset" value="reset">
        <input type="button" value="simpan">
    </form>
</body>
</html>
